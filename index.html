<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Enrique Assad</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Carlos Enrique Assad Castell" />
    <meta name="description" content="Personal portfolio and Resume for Carlos Enrique Assad Castell." />
    <meta name="keywords" content="Carlos Enrique Assad Castell, Resume, Portfolio, Web Development, Enrique Assad, Backend, Java, Python, Data Science, Springboot, Scikit-learn, Pytorch, Tensorflow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:image" content="/img/logo.png" />
    <meta property="og:description" content="Personal portfolio and Resume for Carlos Enrique Assad Castell." />
    <meta property="og:title" content="Enrique Assad Portfolio" />
    <link rel="shortcut icon" href="img/logo.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Lora:wght@400;600&display=swap" />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>

    <!-- Language switcher — always visible, fixed top-right -->
    <div class="lang-switcher">
      <button onclick="changeLanguage('en')" id="btn-en" class="lang-btn active">EN</button>
      <button onclick="changeLanguage('sp')" id="btn-sp" class="lang-btn">ES</button>
    </div>

    <!-- Layout wrapper -->
    <div class="layout">

      <!-- LEFT: Sidebar fragment mount point -->
      <aside id="nav">
        <div style="padding: 30px; text-align: center; color: var(--navy); font-family: 'Space Mono', monospace; font-size: 0.85rem; letter-spacing: 0.05em; opacity: 0.7;">
          <i class="fa fa-spinner fa-spin"></i> Loading...
        </div>
      </aside>

      <!-- RIGHT: Main content -->
      <main class="main">

        <!-- Top navigation tabs — clicking a tab shows only that section -->
        <nav class="topnav" role="tablist">
          <button id="tab-experience" class="tab-btn active" data-tab="experience" data-i18n="experience" role="tab" aria-selected="true" aria-controls="experience">Experience</button>
          <button id="tab-studies"    class="tab-btn"        data-tab="studies"    data-i18n="studies"    role="tab" aria-selected="false" aria-controls="studies">Studies</button>
          <button id="tab-projects"   class="tab-btn"        data-tab="projects"   data-i18n="projects"   role="tab" aria-selected="false" aria-controls="projects">Projects</button>
        </nav>

        <!-- Scrollable panel area — only this div scrolls, not the whole page.
             That's what keeps the sidenav and topnav always in view. -->
        <div class="panels">
          <section id="experience" class="content-section tab-active" role="tabpanel" aria-labelledby="tab-experience">
            <div style="padding: 20px 0; color: var(--navy); font-family: 'Space Mono', monospace; font-size: 0.85rem; opacity: 0.7;">
              <i class="fa fa-spinner fa-spin"></i> Loading experience...
            </div>
          </section>
          <section id="studies"    class="content-section"            role="tabpanel" aria-labelledby="tab-studies">
            <div style="padding: 20px 0; color: var(--navy); font-family: 'Space Mono', monospace; font-size: 0.85rem; opacity: 0.7;">
              <i class="fa fa-spinner fa-spin"></i> Loading studies...
            </div>
          </section>
          <section id="projects"   class="content-section"            role="tabpanel" aria-labelledby="tab-projects">
            <div style="padding: 20px 0; color: var(--navy); font-family: 'Space Mono', monospace; font-size: 0.85rem; opacity: 0.7;">
              <i class="fa fa-spinner fa-spin"></i> Loading projects...
            </div>
          </section>
        </div>

      </main>
    </div>

    <!-- Footer fragment mount point -->
    <footer id="footer">
      <div style="padding: 20px; text-align: center; color: var(--navy); font-family: 'Space Mono', monospace; font-size: 0.8rem; opacity: 0.7;">
        Loading footer...
      </div>
    </footer>

    <script type="module" src="/scripts/loader.js"></script>
  </body>
</html>
